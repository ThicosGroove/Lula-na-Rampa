behaviors:
  LulaAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 2048
      learning_rate: 0.0001
      beta: 0.00001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 5
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 1000

environment_parameters:
  level_difficulty:
    curriculum:
      - name: Lesson0_Easy # Nível 1 (Aprendendo a andar)
        completion_criteria:
          measure: progress
          behavior: LulaAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.1 # Quando chegar a 10% do treino, sobe
        value: 0.0 # Índice do Nível no Array (0 = Level 1)
      
      - name: Lesson1_Medium # Nível 4 (Começa a ficar rápido)
        completion_criteria:
          measure: progress
          behavior: LulaAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3 # Aos 30%
        value: 3.0 # Índice 3 = Level 4
      
      - name: Lesson2_Hard # Nível 8 (Difícil)
        completion_criteria:
          measure: progress
          behavior: LulaAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6 # Aos 60%
        value: 7.0 # Índice 7 = Level 8

      - name: Lesson3_Insane # Nível 13 (Velocidade Máxima)
        value: 12.0 # Índice 12 = Level 13